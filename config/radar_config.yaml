scoring:
  weights:
    momentum: 0.5
    cool: 0.3
    buildability: 0.2
ranking:
  top_k_for_llm: 30
  daily_picks_count: 7
  candidate_window_hours: 48
  reuse_exclusion_days: 3  # exclude items picked in the last N days to ensure fresh picks
  max_picks_per_source: 5  # limits any single source to at most 5 of the 7 daily picks, guaranteeing at least 2 picks from other sources
ingestion:
  hn_fetch_interval_hours: 2
  hn_top_stories_count: 100
llm:
  enable_llm: true  # set to true to use LLM analysis
  model: "llama3.2"
  ollama_base_url: "http://localhost:11434"
worker:
  max_attempts: 3
  timeout_seconds: 300
  stale_timeout_minutes: 10
