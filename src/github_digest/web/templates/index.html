<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub Digest</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
        background: #f7f4ef;
        color: #2a2a2a;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      header {
        margin-bottom: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 32px;
      }
      .subtitle {
        margin: 0 0 16px;
        color: #6a5d54;
      }
      .controls {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      .controls label {
        font-size: 14px;
        color: #6a5d54;
      }
      select {
        font-family: inherit;
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid #eadfcd;
        background: #fffaf3;
      }
      .board {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }
      .card {
        background: #fffaf3;
        border: 1px solid #eadfcd;
        padding: 12px 16px;
        border-radius: 12px;
      }
      .card h3 {
        margin-top: 0;
        font-size: 18px;
      }
      .repo {
        margin: 12px 0;
      }
      .repo a {
        color: #2a2a2a;
        text-decoration: none;
      }
      .repo a:hover {
        text-decoration: underline;
      }
      .meta {
        font-size: 12px;
        color: #6a5d54;
      }
      .summary {
        font-size: 13px;
        margin: 6px 0;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tag {
        background: #eadfcd;
        color: #4a3f38;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        cursor: pointer;
        user-select: none;
      }
      .tag:hover {
        background: #d8cdb8;
      }
      .tag.active {
        background: #b8884a;
        color: #fff;
      }
      .tag-filter {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #b8884a;
        color: #fff;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 13px;
      }
      .tag-filter button {
        background: none;
        border: none;
        color: #fff;
        cursor: pointer;
        font-size: 15px;
        padding: 0;
        line-height: 1;
        opacity: 0.8;
      }
      .tag-filter button:hover {
        opacity: 1;
      }
      .sparkline {
        display: block;
        margin: 6px 0 2px;
        opacity: 0.7;
      }
      .release {
        font-size: 11px;
        color: #6a5d54;
        margin: 4px 0 2px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>GitHub Digest</h1>
      <p class="subtitle">Today’s picks from your saved searches, tuned for discovery.</p>
      <div class="controls">
        <label>
          Mode
          <select id="mode">
            <option value="new">New</option>
            <option value="rising">Rising</option>
            <option value="updated">Updated</option>
          </select>
        </label>
        <label>
          Timeframe
          <select id="timeframe">
            <option value="1">24h</option>
            <option value="7" selected>7d</option>
            <option value="30">30d</option>
          </select>
        </label>
      </div>
    </header>
    <section id="board" class="board">Loading…</section>

    <script>
      function buildSparkline(history, width, height) {
        const stars = history.map((h) => h.stars);
        const min = Math.min(...stars);
        const max = Math.max(...stars);
        const range = max - min || 1;
        const n = stars.length;
        const pad = 2;
        const points = stars
          .map((s, i) => {
            const x = pad + (i / (n - 1)) * (width - pad * 2);
            const y = pad + (1 - (s - min) / range) * (height - pad * 2);
            return `${x.toFixed(1)},${y.toFixed(1)}`;
          })
          .join(" ");
        const ns = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(ns, "svg");
        svg.setAttribute("width", width);
        svg.setAttribute("height", height);
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        svg.classList.add("sparkline");
        const pl = document.createElementNS(ns, "polyline");
        pl.setAttribute("points", points);
        pl.setAttribute("fill", "none");
        pl.setAttribute("stroke", "#b8884a");
        pl.setAttribute("stroke-width", "1.5");
        pl.setAttribute("stroke-linejoin", "round");
        pl.setAttribute("stroke-linecap", "round");
        svg.appendChild(pl);
        // Dot at the last point
        const lastX = pad + (width - pad * 2);
        const lastY = pad + (1 - (stars[n - 1] - min) / range) * (height - pad * 2);
        const circle = document.createElementNS(ns, "circle");
        circle.setAttribute("cx", lastX.toFixed(1));
        circle.setAttribute("cy", lastY.toFixed(1));
        circle.setAttribute("r", "2.5");
        circle.setAttribute("fill", "#b8884a");
        svg.appendChild(circle);
        return svg;
      }

      let boardData = {};
      let activeTag = null;

      function setActiveTag(tag) {
        activeTag = activeTag === tag ? null : tag;
        renderBoard();
      }

      function renderBoard() {
        // Update filter pill in controls
        const existingPill = document.getElementById("tag-filter-pill");
        if (existingPill) existingPill.remove();
        if (activeTag) {
          const pill = document.createElement("div");
          pill.id = "tag-filter-pill";
          pill.className = "tag-filter";
          pill.innerHTML = `<span>${activeTag}</span><button title="Clear filter">✕</button>`;
          pill.querySelector("button").addEventListener("click", () => setActiveTag(activeTag));
          document.querySelector(".controls").appendChild(pill);
        }

        const boardEl = document.getElementById("board");
        boardEl.innerHTML = "";

        Object.entries(boardData).forEach(([name, repos]) => {
          const filtered = activeTag
            ? repos.filter((r) => (r.tags || []).map((t) => t.toLowerCase()).includes(activeTag.toLowerCase()))
            : repos;

          // Hide entire card if filter leaves it empty (but only when filtering)
          if (activeTag && filtered.length === 0) return;

          const card = document.createElement("div");
          card.className = "card";
          const title = document.createElement("h3");
          title.textContent = name;
          card.appendChild(title);

          if (filtered.length === 0) {
            const empty = document.createElement("p");
            empty.textContent = "No repos yet. Run fetch.";
            card.appendChild(empty);
          } else {
            filtered.forEach((repo) => {
              const row = document.createElement("div");
              row.className = "repo";
              row.innerHTML = `<a href="${repo.html_url}" target="_blank">${repo.full_name}</a>`;
              const meta = document.createElement("div");
              meta.className = "meta";
              const delta = repo.delta !== null && repo.delta !== undefined ? ` · +${repo.delta} ★` : "";
              const forks = repo.forks ? ` · 🍴 ${repo.forks.toLocaleString()}` : "";
              const pushedAge = repo.pushed_at ? (() => {
                const days = Math.floor((Date.now() - new Date(repo.pushed_at)) / 86400000);
                return days === 0 ? " · pushed today" : days === 1 ? " · pushed yesterday" : ` · pushed ${days}d ago`;
              })() : "";
              meta.textContent = `⭐ ${repo.stars.toLocaleString()} · ${repo.language || "n/a"}${forks}${delta}${pushedAge}`;
              row.appendChild(meta);

              if (repo.star_history && repo.star_history.length >= 2) {
                row.appendChild(buildSparkline(repo.star_history, 100, 22));
              }

              if (repo.summary) {
                const summary = document.createElement("div");
                summary.className = "summary";
                summary.textContent = repo.summary;
                row.appendChild(summary);

                if (repo.why_interesting) {
                  const why = document.createElement("div");
                  why.className = "summary";
                  why.textContent = repo.why_interesting;
                  row.appendChild(why);
                }

                if (repo.latest_release_tag) {
                  const rel = document.createElement("div");
                  rel.className = "release";
                  rel.textContent = `📦 ${repo.latest_release_tag}` +
                    (repo.latest_release_summary ? ` · ${repo.latest_release_summary}` : "");
                  row.appendChild(rel);
                }

                if (repo.tags && repo.tags.length) {
                  const tags = document.createElement("div");
                  tags.className = "tags";
                  repo.tags.forEach((tag) => {
                    const chip = document.createElement("span");
                    chip.className = "tag" + (activeTag && tag.toLowerCase() === activeTag.toLowerCase() ? " active" : "");
                    chip.textContent = tag;
                    chip.addEventListener("click", () => setActiveTag(tag));
                    tags.appendChild(chip);
                  });
                  row.appendChild(tags);
                }
              }

              card.appendChild(row);
            });
          }

          boardEl.appendChild(card);
        });
      }

      async function loadBoard() {
        activeTag = null;
        const mode = document.getElementById("mode").value;
        const timeframe = document.getElementById("timeframe").value;
        document.getElementById("board").textContent = "Loading…";
        const response = await fetch(`/board/today?mode=${mode}&window_days=${timeframe}`);
        const data = await response.json();
        boardData = data.board;
        renderBoard();
      }

      document.getElementById("mode").addEventListener("change", loadBoard);
      document.getElementById("timeframe").addEventListener("change", loadBoard);
      loadBoard();
    </script>
  </body>
</html>
