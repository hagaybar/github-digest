<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub Digest</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
        background: #f7f4ef;
        color: #2a2a2a;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      header {
        margin-bottom: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 32px;
      }
      .subtitle {
        margin: 0 0 16px;
        color: #6a5d54;
      }
      .controls {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      .controls label {
        font-size: 14px;
        color: #6a5d54;
      }
      select {
        font-family: inherit;
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid #eadfcd;
        background: #fffaf3;
      }
      .board {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }
      .card {
        background: #fffaf3;
        border: 1px solid #eadfcd;
        padding: 12px 16px;
        border-radius: 12px;
      }
      .card h3 {
        margin-top: 0;
        font-size: 18px;
      }
      .repo {
        margin: 12px 0;
      }
      .repo a {
        color: #2a2a2a;
        text-decoration: none;
      }
      .repo a:hover {
        text-decoration: underline;
      }
      .meta {
        font-size: 12px;
        color: #6a5d54;
      }
      .summary {
        font-size: 13px;
        margin: 6px 0;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tag {
        background: #eadfcd;
        color: #4a3f38;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>GitHub Digest</h1>
      <p class="subtitle">Today’s picks from your saved searches, tuned for discovery.</p>
      <div class="controls">
        <label>
          Mode
          <select id="mode">
            <option value="new">New</option>
            <option value="rising">Rising</option>
            <option value="updated">Updated</option>
          </select>
        </label>
        <label>
          Timeframe
          <select id="timeframe">
            <option value="1">24h</option>
            <option value="7" selected>7d</option>
            <option value="30">30d</option>
          </select>
        </label>
      </div>
    </header>
    <section id="board" class="board">Loading…</section>

    <script>
      async function loadBoard() {
        const mode = document.getElementById("mode").value;
        const timeframe = document.getElementById("timeframe").value;
        const response = await fetch(`/board/today?mode=${mode}&window_days=${timeframe}`);
        const data = await response.json();
        const boardEl = document.getElementById("board");
        boardEl.innerHTML = "";

        Object.entries(data.board).forEach(([name, repos]) => {
          const card = document.createElement("div");
          card.className = "card";
          const title = document.createElement("h3");
          title.textContent = name;
          card.appendChild(title);

          if (repos.length === 0) {
            const empty = document.createElement("p");
            empty.textContent = "No repos yet. Run fetch.";
            card.appendChild(empty);
          } else {
            repos.forEach((repo) => {
              const row = document.createElement("div");
              row.className = "repo";
              row.innerHTML = `<a href="${repo.html_url}" target="_blank">${repo.full_name}</a>`;
              const meta = document.createElement("div");
              meta.className = "meta";
              const delta = repo.delta !== null && repo.delta !== undefined ? ` · +${repo.delta}` : "";
              meta.textContent = `⭐ ${repo.stars} · ${repo.language || "n/a"}${delta}`;
              row.appendChild(meta);

              if (repo.summary) {
                const summary = document.createElement("div");
                summary.className = "summary";
                summary.textContent = repo.summary;
                row.appendChild(summary);

                const why = document.createElement("div");
                why.className = "summary";
                why.textContent = repo.why_interesting;
                row.appendChild(why);

                if (repo.tags && repo.tags.length) {
                  const tags = document.createElement("div");
                  tags.className = "tags";
                  repo.tags.forEach((tag) => {
                    const chip = document.createElement("span");
                    chip.className = "tag";
                    chip.textContent = tag;
                    tags.appendChild(chip);
                  });
                  row.appendChild(tags);
                }
              }

              card.appendChild(row);
            });
          }

          boardEl.appendChild(card);
        });
      }

      document.getElementById("mode").addEventListener("change", loadBoard);
      document.getElementById("timeframe").addEventListener("change", loadBoard);
      loadBoard();
    </script>
  </body>
</html>
